# Zeco-lunching<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZeCo on HSE – 12 Safety Rules</title>
<style>
/* =========================================================
   ZeCo on HSE – 12 SAFETY RULES LAUNCH
   Open in Chrome / Edge → press F (fullscreen) → start your
   screen recorder → press SPACE. Press R to restart.
   ========================================================= */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#fff;overflow:hidden;
  font-family:"Segoe UI",Arial,sans-serif}
body.recording{cursor:none}

#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;
  transform-origin:center center;overflow:hidden;background:#fff}

/* rule icons */
.rule{position:absolute;left:0;top:0;width:200px;height:200px;opacity:0;
  transform-origin:center center;will-change:transform,opacity}

.rule.back{filter:blur(7px) !important;opacity:.18 !important;
  transition:filter .7s,opacity .7s,transform .9s cubic-bezier(.25,1.2,.5,1) !important}
.rule.front{z-index:5}

/* cinematic caption */
#cap{position:absolute;left:0;width:1920px;top:790px;text-align:center;color:#0b2a5e;pointer-events:none}
#cap .num{font-size:26px;font-weight:700;letter-spacing:10px;opacity:0;transform:translateY(14px);
  transition:all .7s}
#cap .num b{color:#d90a17}
#cap .name{font-size:60px;font-weight:800;text-transform:uppercase;letter-spacing:40px;
  opacity:0;filter:blur(8px);margin-top:6px;transition:all 1.1s cubic-bezier(.2,.8,.2,1)}
#cap .bar{height:5px;width:0;background:#d90a17;margin:18px auto 0;transition:width .9s cubic-bezier(.6,0,.2,1)}
#cap.show .num{opacity:1;transform:none}
#cap.show .name{opacity:1;filter:none;letter-spacing:8px}
#cap.show .bar{width:260px}
/* exit: number lifts away, name spreads out + blurs, red line pulls in to the centre */
#cap.hide .num{opacity:0;transform:translateY(-16px);transition:all .5s cubic-bezier(.5,0,.75,0)}
#cap.hide .name{opacity:0;filter:blur(12px);letter-spacing:26px;transform:translateY(-8px);
  transition:all .75s cubic-bezier(.5,0,.75,0)}
#cap.hide .bar{width:0;transition:width .5s cubic-bezier(.7,0,.3,1)}

/* ZeCo logo */
#logo{position:absolute;left:960px;top:540px;width:0;height:0;
  transition:top 1.6s cubic-bezier(.65,0,.25,1)}
#logoArt{position:absolute;left:0;top:0;transform-origin:center center;
  transition:transform 1.6s cubic-bezier(.65,0,.25,1)}
#logoArt .pc{position:absolute;opacity:0}
.pc.wave   {clip-path:inset(0 100% 0 0)}
.pc.redwave{clip-path:inset(0 0 0 100%)}
.pc.z {transform:translateX(-320px);filter:blur(22px)}
.pc.e {transform:translateY(-140px);filter:blur(18px)}
.pc.c {transform:rotate(-200deg) scale(1.7);filter:blur(24px)}
.pc.o {transform:translateY(140px);filter:blur(18px)}
.pc.t {transform:translateX(60px);filter:blur(12px)}
.pc.in{opacity:1 !important;clip-path:inset(0 0 0 0) !important;transform:none !important;filter:none !important}
.pc.wave.in,.pc.redwave.in{transition:clip-path 2.4s cubic-bezier(.7,0,.2,1),opacity .3s}
.pc.z.in{transition:all 1.8s cubic-bezier(.16,1,.3,1)}
.pc.e.in{transition:all 1.6s cubic-bezier(.16,1,.3,1)}
.pc.c.in{transition:all 2.2s cubic-bezier(.16,1,.3,1)}
.pc.o.in{transition:all 1.6s cubic-bezier(.16,1,.3,1)}
.pc.t.in{transition:all 1.1s cubic-bezier(.16,1,.3,1)}

/* light sheen passing over the logo (only visible on the coloured parts) */
#sheen{position:absolute;inset:0;overflow:hidden;pointer-events:none;mix-blend-mode:screen}
#sheen::before{content:"";position:absolute;top:-20%;left:-40%;width:22%;height:140%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);
  transform:skewX(-20deg)}
#sheen.go::before{animation:sheen 1.8s cubic-bezier(.6,0,.3,1) forwards}
@keyframes sheen{to{left:120%}}

/* horizontal light line before the logo */
#streak{position:absolute;left:960px;top:540px;height:3px;width:0;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,#d90a17 30%,#0b2a5e 70%,transparent);opacity:0}
#streak.go{animation:streak 1.4s cubic-bezier(.7,0,.3,1) forwards}
@keyframes streak{0%{width:0;opacity:1}55%{width:1500px;opacity:1}100%{width:1900px;opacity:0;height:1px}}

/* tagline */
#tag{position:absolute;left:-900px;width:1800px;top:225px;text-align:center;
  font-size:58px;font-weight:600;color:#0b2a5e;letter-spacing:6px;white-space:nowrap;
  transform-origin:center top;transition:transform 1.6s cubic-bezier(.65,0,.25,1)}
#tag .w{display:inline-block;opacity:0;filter:blur(12px);transform:translateY(24px);
  margin:0 12px;transition:all 1.1s cubic-bezier(.16,1,.3,1)}
#tag .w.in{opacity:1;filter:none;transform:none}
#tag b{color:#d90a17;font-weight:800}
#tag .line{display:block;height:4px;width:0;margin:20px auto 0;background:#d90a17;
  transition:width 1.2s cubic-bezier(.7,0,.2,1)}
#tag .line.in{width:520px}

/* burst effects */
.ring{position:absolute;left:960px;top:540px;width:20px;height:20px;margin:-10px 0 0 -10px;
  border-radius:50%;border:6px solid;opacity:0;pointer-events:none}
.ring.go{animation:ring 1.6s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(90);opacity:0;border-width:1px}}
.spark{position:absolute;left:960px;top:540px;border-radius:50%;pointer-events:none;
  transition:transform 1.4s cubic-bezier(.1,.8,.3,1),opacity 1.4s ease-in}

/* start menu (not part of the video) */
#menu{position:fixed;inset:0;background:rgba(255,255,255,.96);z-index:99;
  display:flex;align-items:center;justify-content:center;color:#0b2a5e}
#menu .box{border:2px solid #0b2a5e;border-radius:18px;padding:40px 50px;
  max-width:560px;font-size:18px;line-height:1.8}
#menu h1{font-size:28px;margin-bottom:10px}
#menu kbd{background:#e5e9f0;border-radius:5px;padding:1px 8px;font-family:inherit}
#menu button{margin-top:20px;padding:12px 30px;font-size:18px;font-weight:700;
  border-radius:10px;border:none;cursor:pointer;background:#0b2a5e;color:#fff}
</style>
</head>

<script>
/* ===== TIMING – bigger number = slower ===== */
const CONFIG = {
  // Rule names shown under each logo during the entrance
  names: [
    "Fit to Work", "Energy Isolation", "Working at Height",
    "Excavation Work", "Management of Change", "Permit to Work",
    "Confined Space", "Lifting Operation & Suspended Load", "Personal Protective Equipment",
    "Smoking & Vaping", "Safe Driving", "Hazardous Materials"
  ],
  ruleHold: 1.6,  // seconds each rule stays big in the centre
  endHold: 12,    // seconds the final screen stays (just keep recording)
  fadeOut: 9,     // seconds the music takes to fade away at the end (slow fade)

  // ---- SOUND ----
  sfx:         true,  // cinematic whooshes / hits synced to the animation
  sfxVolume:   1.2,
  drone:       true,  // low background hum (only used when NO music is loaded)
  musicVolume: 1.8,  // 1 = normal, 2 = very loud (a limiter stops distortion)
  // Second in YOUR SONG where the biggest beat/drop is. The video will line up
  // so the ZeCo logo finishes exactly on that beat. Leave null to just start the song at 0.
  musicHitAt:  null,
  speed:   1      // 0.8 = slower overall, 1.2 = faster
};
/* ========================================== */

const $ = s => document.querySelector(s);
/* drift-free clock: every wait is measured from the moment Start was pressed */
let T0 = 0, VT = 0;
const wait = s => { VT += s * 1000 / CONFIG.speed;
  return new Promise(r => setTimeout(r, Math.max(0, T0 + VT - performance.now()))); };
const NAVY = "#0b2a5e", RED = "#d90a17";

function fit(){
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  $("#stage").style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener("resize", fit); fit();

/* ---------- grid positions (3 across, 4 down) ---------- */
function grid(size, gapX, gapY, top){
  const w = 3 * size + 2 * gapX, h = 4 * size + 3 * gapY;
  const x0 = (1920 - w) / 2, y0 = top ?? (1080 - h) / 2;
  return i => ({ x: x0 + (i % 3) * (size + gapX), y: y0 + Math.floor(i / 3) * (size + gapY), s: size });
}
const gridA = grid(222, 80, 12);          // rules alone, centred
const gridB = grid(180, 70, 10, 282);     // rules under the logo

/* move an icon: centre-based so scaling looks natural */
function place(el, p, extra = "", t = null){
  const k = p.s / 200;
  if (t) el.style.transition = t;
  el.style.transform = `translate(${p.x + p.s/2 - 100}px,${p.y + p.s/2 - 100}px) scale(${k}) ${extra}`;
}

const rules = RULE_IMAGES.map(src => {
  const im = document.createElement("img");
  im.src = src; im.className = "rule";
  $("#rules").appendChild(im);
  return im;
});

/* ---------- logo pieces ---------- */
const BIG = 0.86, SMALL = 0.40;
const art = $("#logoArt");
art.style.width = LOGO.W + "px"; art.style.height = LOGO.H + "px";
art.style.left = -LOGO.W / 2 + "px"; art.style.top = -LOGO.H / 2 + "px";
art.style.transform = `scale(${BIG})`;
const piece = {};
const cls = { wave:"wave", redwave:"redwave", z:"z", e:"e", c:"c", o:"o", o2:"t", n:"t", H:"t", S:"t", E:"t" };
for (const [k, p] of Object.entries(LOGO.p)){
  const im = document.createElement("img");
  im.src = p.src; im.className = "pc " + cls[k];
  Object.assign(im.style, { left: p.x + "px", top: p.y + "px", width: p.w + "px", height: p.h + "px" });
  art.appendChild(im); piece[k] = im;
}
const show = k => piece[k].classList.add("in");
art.appendChild($("#sheen"));
                // sheen sits above the pieces
art.style.transform = `scale(${BIG * 1.22})`; // camera starts close
$("#logo").style.top = "470px";

/* ---------- effects ---------- */
function rings(colors, gap = 180){
  colors.forEach((c, i) => setTimeout(() => {
    const r = document.createElement("div");
    r.className = "ring"; r.style.borderColor = c;
    $("#fx").appendChild(r);
    requestAnimationFrame(() => r.classList.add("go"));
    setTimeout(() => r.remove(), 1800);
  }, i * gap));
}
function sparks(n = 46){
  for (let i = 0; i < n; i++){
    const d = document.createElement("div");
    const sz = 6 + Math.random() * 14;
    d.className = "spark";
    Object.assign(d.style, { width: sz + "px", height: sz + "px", marginLeft: -sz/2 + "px", marginTop: -sz/2 + "px",
      background: i % 2 ? NAVY : RED });
    $("#fx").appendChild(d);
    const a = Math.random() * Math.PI * 2, dist = 350 + Math.random() * 650;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      d.style.transform = `translate(${Math.cos(a) * dist}px,${Math.sin(a) * dist}px)`;
      d.style.opacity = 0;
    }));
    setTimeout(() => d.remove(), 1600);
  }
}


/* ---------- SOUND ENGINE (generated live, no files needed) ---------- */
let AC = null, OUT = null, BUS = null, NOISE = null, droneNodes = null, music = null, musicGain = null;
function initAudio(){
  AC = new (window.AudioContext || window.webkitAudioContext)();
  // master bus → limiter → speakers (lets everything be loud without crackling)
  const lim = AC.createDynamicsCompressor();
  lim.threshold.value = -6; lim.knee.value = 4; lim.ratio.value = 12; lim.attack.value = .003; lim.release.value = .25;
  BUS = AC.createGain(); BUS.gain.value = 1; BUS.connect(lim); lim.connect(AC.destination);
  OUT = AC.createGain(); OUT.gain.value = CONFIG.sfx ? CONFIG.sfxVolume : 0;
  const rev = AC.createConvolver(), wet = AC.createGain();
  const len = AC.sampleRate * 3, ir = AC.createBuffer(2, len, AC.sampleRate);
  for (let c = 0; c < 2; c++){ const d = ir.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  rev.buffer = ir; wet.gain.value = 0.35;
  OUT.connect(BUS); OUT.connect(rev); rev.connect(wet); wet.connect(BUS);
  NOISE = AC.createBuffer(1, AC.sampleRate * 4, AC.sampleRate);
  const nd = NOISE.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
}
const now = () => AC.currentTime;
function env(g, t, peak, attack, release){
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + attack + release);
}
function whoosh(dur = 1, up = true, vol = .4){
  if (!AC) return; const t = now();
  const s = AC.createBufferSource(); s.buffer = NOISE;
  const f = AC.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.4;
  f.frequency.setValueAtTime(up ? 250 : 3500, t);
  f.frequency.exponentialRampToValueAtTime(up ? 3500 : 250, t + dur);
  const g = AC.createGain(); env(g, t, vol, dur * .65, dur * .45);
  s.connect(f); f.connect(g); g.connect(OUT); s.start(t); s.stop(t + dur * 1.2);
}
function boom(vol = .8, low = 48){
  if (!AC) return; const t = now();
  const o = AC.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(low, t + .25);
  const g = AC.createGain(); env(g, t, vol, .01, 1.8);
  o.connect(g); g.connect(OUT); o.start(t); o.stop(t + 2);
  const s = AC.createBufferSource(); s.buffer = NOISE;
  const f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900;
  const g2 = AC.createGain(); env(g2, t, vol * .5, .005, .35);
  s.connect(f); f.connect(g2); g2.connect(OUT); s.start(t); s.stop(t + .5);
}
function hit(){
  if (!AC) return; boom(1, 40);
  const t = now(), s = AC.createBufferSource(); s.buffer = NOISE;
  const f = AC.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 2500;
  const g = AC.createGain(); env(g, t, .25, .01, 2.6);
  s.connect(f); f.connect(g); g.connect(OUT); s.start(t); s.stop(t + 3);
}
function riser(dur = 3){
  if (!AC) return; const t = now();
  const s = AC.createBufferSource(); s.buffer = NOISE;
  const f = AC.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 3;
  f.frequency.setValueAtTime(200, t); f.frequency.exponentialRampToValueAtTime(7000, t + dur);
  const o = AC.createOscillator(); o.type = "sawtooth";
  o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(420, t + dur);
  const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1400;
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(.45, t + dur); g.gain.linearRampToValueAtTime(0, t + dur + .05);
  const g2 = AC.createGain(); g2.gain.value = .25;
  s.connect(f); f.connect(g); o.connect(lp); lp.connect(g2); g2.connect(g); g.connect(OUT);
  s.start(t); o.start(t); s.stop(t + dur + .1); o.stop(t + dur + .1);
}
function tone(freq, vol = .18, len = 1.2, type = "sine", delay = 0){
  if (!AC) return; const t = now() + delay;
  const o = AC.createOscillator(); o.type = type; o.frequency.value = freq;
  const g = AC.createGain(); env(g, t, vol, .008, len);
  o.connect(g); g.connect(OUT); o.start(t); o.stop(t + len + .1);
}
function shimmer(){ [1175, 1397, 1760, 2349, 2794].forEach((f, i) => tone(f, .07, 1.4, "sine", i * .07)); }
function droneStart(){
  if (!AC || !CONFIG.drone || music) return; const t = now();
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.08, t + 4);
  const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 380;
  const os = [73.4, 110, 73.9].map(f => { const o = AC.createOscillator(); o.type = "sawtooth"; o.frequency.value = f; o.connect(lp); o.start(t); return o; });
  lp.connect(g); g.connect(BUS); droneNodes = { g, os };
}
function droneLift(){ if (droneNodes) droneNodes.g.gain.linearRampToValueAtTime(.14, now() + 2); }
function fadeAllOut(sec = 9){
  if (droneNodes){ const g = droneNodes.g.gain; g.setValueAtTime(g.value, now());
    g.setTargetAtTime(0.0001, now(), sec / 4); }
  if (endPadNodes){ const g = endPadNodes.gain; g.cancelScheduledValues(now()); g.setValueAtTime(g.value, now());
    g.setTargetAtTime(0.0001, now(), sec / 4); }
  if (musicGain){
    // smooth curve: drops gently at first, then eases out to silence
    const v0 = musicGain.gain.value, n = 200, curve = new Float32Array(n);
    for (let i = 0; i < n; i++) curve[i] = v0 * Math.pow(1 - i / (n - 1), 2.2);
    musicGain.gain.cancelScheduledValues(now());
    musicGain.gain.setValueCurveAtTime(curve, now(), sec);
    setTimeout(() => music.pause(), sec * 1000 + 200);
  }
}
/* long warm chord that holds under the final screen */
let endPadNodes = null;
function endPad(){
  if (!AC) return; const t = now();
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(.09, t + 1.5);
  const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1200;
  [73.4, 146.8, 220, 293.7, 370, 440].forEach((f, i) => {
    [-4, 4].forEach(dt => { const o = AC.createOscillator(); o.type = i < 2 ? "sine" : "triangle";
      o.frequency.value = f; o.detune.value = dt; o.connect(lp); o.start(t); o.stop(t + 60); });
  });
  lp.connect(g); g.connect(OUT); endPadNodes = g;
}
/* time (s) from Start until the ZeCo logo is complete = the big hit */
function logoHitTime(){
  const per = 0.45 + 0.75 + CONFIG.ruleHold + 0.35 + 1.0;
  return (0.8 + 12 * per + 0.4 + 2.8 + 1.9 + 0.9 + 0.4 + 1.3 + 0.9 + 0.8 + 1.1 + 1.1 + 5 * 0.22 + 0.9) / CONFIG.speed;
}
function startMusic(){
  if (!music) return;
  music.volume = 1;
  musicGain = AC.createGain(); musicGain.gain.value = CONFIG.musicVolume;
  AC.createMediaElementSource(music).connect(musicGain); musicGain.connect(BUS);
  if (CONFIG.musicHitAt == null){ music.currentTime = 0; music.play(); return; }
  const off = CONFIG.musicHitAt - logoHitTime();
  if (off >= 0){ music.currentTime = off; music.play(); }
  else { music.currentTime = 0; setTimeout(() => music.play(), -off * 1000); }
}

/* ---------- TIMELINE ---------- */
async function run(){
  await wait(0.8);

  // 1. Cinematic entrance: each rule zooms in at centre, name reveals,
  //    then it flies into the 3 x 4 grid while the others sit blurred behind
  const SHOW = { x: 960 - 230, y: 420 - 230, s: 460 };
  const cap = $("#cap");
  for (let i = 0; i < rules.length; i++){
    const r = rules[i];
    rules.slice(0, i).forEach(o => o.classList.add("back"));

    // start far away, blurred
    place(r, SHOW, "scale(.25)", "none");
    r.style.filter = "blur(18px)"; r.style.opacity = 0;
    r.classList.add("front"); void r.offsetWidth;

    // push in
    whoosh(1.0, true, .35);
    r.style.transition = "transform 1.1s cubic-bezier(.16,1,.3,1), opacity .6s, filter .9s";
    r.style.opacity = 1; r.style.filter = "none";
    place(r, SHOW);

    // caption (reset to start position while invisible)
    cap.className = "";
    cap.querySelector(".num").innerHTML = `<b>${String(i + 1).padStart(2, "0")}</b> / 12`;
    cap.querySelector(".name").textContent = CONFIG.names[i] || "";
    await wait(0.45);
    cap.className = "show";
    boom(.45, 62); tone([587, 659, 698, 784][i % 4] / 2, .06, 1.6, "triangle");
    await wait(0.75);

    // slow camera drift while holding
    r.style.transition = `transform ${CONFIG.ruleHold + 0.3}s linear`;
    place(r, SHOW, "scale(1.06)");
    await wait(CONFIG.ruleHold);

    // fade caption, then fly to its place in the grid
    cap.className = "hide";
    await wait(0.35);
    r.style.transition = "transform 1s cubic-bezier(.7,0,.2,1)";
    place(r, gridA(i)); whoosh(.8, false, .22);
    rules.slice(0, i).forEach(o => o.classList.remove("back"));
    await wait(1.0);
    tone(1320, .05, .5);
    r.classList.remove("front");
  }
  // all 12 together: a quick ripple across the grid
  await wait(0.4);
  shimmer(); droneLift();
  rules.forEach((r, i) => setTimeout(() => {
    r.style.transition = "transform .35s ease-out";
    place(r, gridA(i), "scale(1.08)");
    setTimeout(() => place(r, gridA(i)), 350);
  }, i * 70));
  await wait(2.8);

  // 2. Rules fly past the camera and dissolve
  whoosh(1.5, true, .6); riser(2.75);
  rules.forEach((r, i) => setTimeout(() => {
    r.style.transition = "transform 1.3s cubic-bezier(.55,0,.8,.4), opacity 1.1s ease-in, filter 1.1s";
    place(r, gridA(i), "scale(2.8)");
    r.style.filter = "blur(24px)";
    r.style.opacity = 0;
  }, [4,1,7,10,3,0,9,6,2,11,5,8].indexOf(i) * 70));
  await wait(1.9);

  // 3. Light streak, then the ZeCo logo forms while the camera slowly pulls back
  $("#streak").classList.add("go"); hit();
  await wait(0.9);
  art.style.transition = "transform 9s cubic-bezier(.2,.6,.3,1)";
  art.style.transform = `scale(${BIG})`;
  show("wave");    whoosh(2.2, true, .3); await wait(0.4);
  show("redwave"); await wait(1.3);
  show("z");       whoosh(.9, true, .4); boom(.35, 70); await wait(0.9);
  show("e");       whoosh(.7, false, .35); boom(.3, 75); await wait(0.8);
  show("c");       whoosh(1.3, true, .45); tone(196, .1, 2, "triangle"); await wait(1.1);
  show("o");       whoosh(.7, true, .35); boom(.3, 70); await wait(1.1);
  for (const [j, k] of ["o2", "n", "H", "S", "E"].entries()){ show(k); tone([587, 659, 784, 880, 1175][j], .09, .7); await wait(0.22); }
  await wait(0.9);
  $("#sheen").classList.add("go"); hit(); shimmer();
  await wait(1.2);

  // tagline: Zero Compromise on HSE
  for (const [j, w] of [...document.querySelectorAll("#tag .w")].entries()){
    w.classList.add("in"); tone([294, 370, 440, 587][j], .12, 2.2, "triangle"); await wait(0.45); }
  $("#tag .line").classList.add("in");
  await wait(3.2);

  // 4. Logo + tagline go up, rules come back underneath
  art.style.transition = "transform 1.6s cubic-bezier(.65,0,.25,1)";
  whoosh(1.5, true, .4);
  $("#logo").style.top = "118px";
  art.style.transform = `scale(${SMALL})`;
  $("#tag").style.transform = "translateY(-120px) scale(.45)";
  await wait(1.0);
  rules.forEach((r, i) => setTimeout(() => {
    const p = gridB(i);
    place(r, p, "scale(.6)", "none");
    r.style.filter = "blur(14px)"; r.style.opacity = 0; void r.offsetWidth;
    r.style.transition = "transform 1s cubic-bezier(.16,1,.3,1), opacity .7s, filter .8s";
    r.style.opacity = 1; r.style.filter = "none";
    place(r, p); tone(880 + i * 40, .035, .4);
  }, i * 120));
  await wait(2.6);

  // 5. Final hold (end of video)
  boom(.6, 45); shimmer(); endPad();
  await wait(Math.max(0, CONFIG.endHold - CONFIG.fadeOut));
  fadeAllOut(CONFIG.fadeOut / CONFIG.speed);
  await wait(CONFIG.fadeOut);
}

let started = false;
function start(){
  if (started) return; started = true;
  $("#menu").style.display = "none";
  document.body.classList.add("recording");
  initAudio(); droneStart(); startMusic();
  T0 = performance.now(); VT = 0;
  run();
}
$("#startBtn").onclick = start;
$("#musicBtn").onclick = () => $("#musicFile").click();
$("#musicFile").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  music = new Audio(URL.createObjectURL(f)); music.preload = "auto";
  $("#musicStatus").textContent = "✔ Music loaded: " + f.name +
    (CONFIG.musicHitAt == null ? " (starts at 0:00)" : ` (beat at ${CONFIG.musicHitAt}s will hit when the logo completes)`);
};
addEventListener("keydown", e => {
  if (e.code === "Space"){ e.preventDefault(); start(); }
  if (e.key === "r" || e.key === "R") location.reload();
  if (e.key === "f" || e.key === "F")
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
});
